# Builds the multi-arch server image and pushes it to Google Artifact Registry.
#
# Mirrors the `bun run package` script:
#   docker buildx build --platform linux/amd64,linux/arm64 --push \
#     -t europe-west1-docker.pkg.dev/uccle-sport/docker/scoreboard:<version> .
#
# Triggered by pushing a version tag (e.g. v0.0.6). The tag (minus the leading "v")
# becomes the image tag, and the image is also tagged `latest`.
#
# Auth uses keyless Workload Identity Federation. Configure these repository
# variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  e.g. projects/123456789/locations/global/workloadIdentityPools/github/providers/github
#   GCP_SERVICE_ACCOUNT             e.g. github-actions@uccle-sport.iam.gserviceaccount.com
# The service account needs the `roles/artifactregistry.writer` role on the registry.

name: Build and Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: europe-west1-docker.pkg.dev/uccle-sport/docker/scoreboard
  REGISTRY: europe-west1-docker.pkg.dev

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json is the single source of truth for the version. On a tag push,
      # the tag must match it exactly (bump with `bun pm version` / `npm version`,
      # which edits package.json and creates the matching tag) — otherwise fail,
      # so the git tag and the version baked into the app can never drift apart.
      - name: Resolve and verify version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag v$tag_version does not match package.json version $version." \
                   "Bump with 'bun pm version' / 'npm version' so they stay in sync."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image version: $version"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
